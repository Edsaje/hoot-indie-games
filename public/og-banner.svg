<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#162544" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#0e172a" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#070a12" stop-opacity="1" />
    </radialGradient>
    <radialGradient id="emeraldAura" cx="80%" cy="20%" r="40%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="goldAura" cx="20%" cy="70%" r="40%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Gold Text Gradient -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Badge Gradients -->
    <linearGradient id="badgeBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.3" />
    </linearGradient>
    <linearGradient id="badgeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="#070a12" />
  <rect width="1200" height="630" fill="url(#bgGlow)" />
  <rect width="1200" height="630" fill="url(#emeraldAura)" />
  <rect width="1200" height="630" fill="url(#goldAura)" />

  <!-- Ambient Stars & Bioluminescent Spores -->
  <g opacity="0.6">
    <circle cx="95" cy="80" r="2" fill="#ffffff" opacity="0.8" />
    <circle cx="210" cy="140" r="1.5" fill="#fef08a" opacity="0.7" />
    <circle cx="340" cy="65" r="2.5" fill="#ffffff" opacity="0.9" />
    <circle cx="480" cy="120" r="1.5" fill="#a7f3d0" opacity="0.8" />
    <circle cx="720" cy="75" r="2" fill="#ffffff" opacity="0.75" />
    <circle cx="890" cy="130" r="2" fill="#fef08a" opacity="0.6" />
    <circle cx="1060" cy="90" r="3" fill="#6ee7b7" opacity="0.8" />
    <circle cx="1140" cy="180" r="1.5" fill="#ffffff" opacity="0.9" />
    <circle cx="80" cy="320" r="2" fill="#34d399" opacity="0.7" />
    <circle cx="1120" cy="380" r="2.5" fill="#fbbf24" opacity="0.8" />
    <circle cx="150" cy="520" r="1.5" fill="#ffffff" opacity="0.8" />
    <circle cx="1020" cy="540" r="2" fill="#a7f3d0" opacity="0.7" />
    <!-- Firefly glowing orbs -->
    <circle cx="280" cy="220" r="4" fill="#fbbf24" opacity="0.5" />
    <circle cx="280" cy="220" r="8" fill="#fbbf24" opacity="0.15" />
    <circle cx="980" cy="260" r="4" fill="#34d399" opacity="0.5" />
    <circle cx="980" cy="260" r="8" fill="#34d399" opacity="0.15" />
    <circle cx="180" cy="440" r="3.5" fill="#f59e0b" opacity="0.4" />
    <circle cx="1050" cy="460" r="4" fill="#10b981" opacity="0.4" />
  </g>

  <!-- Decorative Outer Frame with Golden Accents -->
  <rect x="24" y="24" width="1152" height="582" rx="16" fill="none" stroke="#334155" stroke-width="1.5" opacity="0.6" />
  <rect x="36" y="36" width="1128" height="558" rx="12" fill="none" stroke="#f59e0b" stroke-width="1" opacity="0.25" />

  <!-- Corner Flourishes -->
  <path d="M24 60 V36 A12 12 0 0 1 36 24 H60" fill="none" stroke="#f59e0b" stroke-width="3" />
  <path d="M1140 24 H1164 A12 12 0 0 1 1176 36 V60" fill="none" stroke="#f59e0b" stroke-width="3" />
  <path d="M24 570 V594 A12 12 0 0 0 36 606 H60" fill="none" stroke="#f59e0b" stroke-width="3" />
  <path d="M1140 606 H1164 A12 12 0 0 0 1176 594 V570" fill="none" stroke="#f59e0b" stroke-width="3" />

  <!-- Main Owl Mascot Emblem (Center-Top) -->
  <g transform="translate(600, 140) scale(1.6)">
    <!-- Owl Body Glow -->
    <circle cx="0" cy="0" r="38" fill="#f59e0b" opacity="0.15" />
    <!-- Owl Silhouette -->
    <path d="M0 -32 C-14 -32 -24 -20 -24 -4 C-24 16 -14 31 0 34 C14 31 24 16 24 -4 C24 -20 14 -32 0 -32 Z" fill="#0f172a" stroke="#f59e0b" stroke-width="2.5" />
    <!-- Feather Tufts / Ears -->
    <path d="M-18 -26 L-11 -15 L-20 -13 Z" fill="#f59e0b" />
    <path d="M18 -26 L20 -13 L11 -15 Z" fill="#f59e0b" />
    <!-- Eye Sockets -->
    <circle cx="-10" cy="-6" r="9.5" fill="#070a12" stroke="#334155" stroke-width="1.5" />
    <circle cx="10" cy="-6" r="9.5" fill="#070a12" stroke="#334155" stroke-width="1.5" />
    <!-- Golden Irises -->
    <circle cx="-10" cy="-6" r="5.5" fill="#fbbf24" />
    <circle cx="10" cy="-6" r="5.5" fill="#fbbf24" />
    <!-- Deep Pupils -->
    <circle cx="-10" cy="-6" r="2.2" fill="#0b0f19" />
    <circle cx="10" cy="-6" r="2.2" fill="#0b0f19" />
    <!-- Sharp Beak -->
    <path d="M0 -2 L3.5 6 L0 10 L-3.5 6 Z" fill="#f59e0b" />
  </g>

  <!-- Main Title -->
  <text x="600" y="260" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="52" fill="#ffffff" letter-spacing="4">
    HOOT INDIE GAMES
  </text>

  <!-- Gold Subtitle / Brand Mission -->
  <text x="600" y="305" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="20" fill="url(#goldGradient)" letter-spacing="3">
    LE SANCTUAIRE DES JEUX VIDÉO INDÉPENDANTS
  </text>
  <text x="600" y="335" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="16" fill="#94a3b8" letter-spacing="1">
    Explorateur de Pépites Certifiées • 3 Défis Quotidiens • Arène 1v1 • Véritable Arcade 1982
  </text>

  <!-- Feature Badges Grid (4 Badges) -->
  <!-- Badge 1: Pépites Certifiées -->
  <g transform="translate(130, 385)">
    <rect width="210" height="95" rx="12" fill="url(#badgeBg)" stroke="url(#badgeBorder)" stroke-width="1.5" />
    <text x="105" y="36" text-anchor="middle" font-size="24">🦉</text>
    <text x="105" y="62" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="14" fill="#f8fafc">94 PÉPITES</text>
    <text x="105" y="80" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="11" fill="#94a3b8">Catalogue Certifié Steam</text>
  </g>

  <!-- Badge 2: Screenle & Indledle -->
  <g transform="translate(365, 385)">
    <rect width="210" height="95" rx="12" fill="url(#badgeBg)" stroke="url(#badgeBorder)" stroke-width="1.5" />
    <text x="105" y="36" text-anchor="middle" font-size="24">📸</text>
    <text x="105" y="62" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="14" fill="#f8fafc">DÉFIS DU JOUR</text>
    <text x="105" y="80" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="11" fill="#94a3b8">Screenle, Indledle, Linkle</text>
  </g>

  <!-- Badge 3: Versus 1v1 Multi -->
  <g transform="translate(600, 385)">
    <rect width="210" height="95" rx="12" fill="url(#badgeBg)" stroke="url(#badgeBorder)" stroke-width="1.5" />
    <text x="105" y="36" text-anchor="middle" font-size="24">⚔️</text>
    <text x="105" y="62" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="14" fill="#f8fafc">ARÈNE 1v1 P2P</text>
    <text x="105" y="80" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="11" fill="#94a3b8">Duels WebRTC en Temps Réel</text>
  </g>

  <!-- Badge 4: Arcade & Vectrex -->
  <g transform="translate(835, 385)">
    <rect width="210" height="95" rx="12" fill="url(#badgeBg)" stroke="url(#badgeBorder)" stroke-width="1.5" />
    <text x="105" y="36" text-anchor="middle" font-size="24">🕹️</text>
    <text x="105" y="62" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="14" fill="#f8fafc">SALLE D'ARCADE</text>
    <text x="105" y="80" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="11" fill="#94a3b8">8 Jeux Rétro &amp; Vectrex 1982</text>
  </g>

  <!-- Bottom Brand Bar -->
  <g transform="translate(600, 545)">
    <rect x="-240" y="-18" width="480" height="36" rx="18" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <!-- Green Live Indicator -->
    <circle cx="-195" cy="0" r="4.5" fill="#10b981" />
    <text x="-175" y="4.5" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="13" fill="#cbd5e1" letter-spacing="1">
      EN LIGNE SUR
    </text>
    <text x="-65" y="4.5" font-family="monospace" font-weight="700" font-size="14" fill="#fbbf24">
      https://hootindiegames.com
    </text>
  </g>
</svg>
