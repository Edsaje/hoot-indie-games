      <div style="max-width: 800px; margin: 2rem auto; padding: 2rem; background: #131a29; border: 1px solid #f59e0b; border-radius: 12px; color: #e2e8f0; font-family: sans-serif; line-height: 1.6;">
        <h1 style="color: #f59e0b; font-size: 1.8rem; margin-top: 0;">🦉 Hoot Indie Games — Le Sanctuaire des Jeux Vidéo Indépendants</h1>
        <p>Bienvenue sur <strong>Hoot Indie Games</strong>, la plateforme consacrée à la mise en lumière des pépites du jeu vidéo indépendant.</p>
        <h2>🎮 Au programme :</h2>
        <ul>
          <li><strong>Explorateur de 94 Pépites Certifiées :</strong> Fiches détaillées, captures HD et liens Steam vérifiés sans hallucination.</li>
          <li><strong>Screenle :</strong> Le jeu quotidien d'identification d'un jeu indé à partir d'un zoom progressif de capture d'écran.</li>
          <li><strong>Indledle :</strong> La devinette quotidienne par déduction d'attributs (année, genre, studio, style visuel, caméra).</li>
          <li><strong>Linkle :</strong> Le défi des 16 connexions thématiques secrètes entre œuvres indépendantes.</li>
          <li><strong>Arène Versus 1v1 :</strong> Duels multijoueurs P2P en temps réel via WebRTC.</li>
          <li><strong>Salle d'Arcade Rétro :</strong> 8 jeux cultes jouables dont le véritable <em>Mine Storm</em> Vectrex 1982.</li>
        </ul>
        <p style="color: #94a3b8; font-size: 0.9rem;">Pour profiter de l'expérience interactive complète et des jeux en direct, veuillez activer JavaScript dans votre navigateur.</p>
