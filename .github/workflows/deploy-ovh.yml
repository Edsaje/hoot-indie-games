name: 🚀 Déploiement Continu OVH

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'DEPLOY.md'
      - '.gitignore'
  workflow_dispatch: # Déclenchement manuel en 1 clic depuis l'interface GitHub

concurrency:
  group: 'ovh-deploy'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Récupération du code
        uses: actions/checkout@v7

      - name: ⚙️ Configuration Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Installation des dépendances
        run: npm ci

      - name: 🛡️ Audit de conformité de la base de données
        run: npm run audit-db

      - name: 🔐 Configuration de l'environnement
        run: |
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" >> .env
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}" >> .env

      - name: 🏗️ Compilation de production (Vite / React)
        run: npm run build

      - name: ✉️ Configuration sécurisée de messagerie (Resend)
        run: |
          echo "<?php define('RESEND_API_KEY', '${{ secrets.RESEND_API_KEY }}');" > public/api/.mail_config.php
          mkdir -p dist/api
          cp public/api/.mail_config.php dist/api/.mail_config.php

      - name: 📤 Déploiement FTP vers OVH
        id: ftp-deploy-1
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.cluster129.hosting.ovh.net
          username: hootinu
          password: ${{ secrets.OVH_FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ./www/
          dangerous-clean-slate: false
          timeout: 180000
          log-level: verbose

      - name: ⏳ Pause défensive avant réessai OVH si nécessaire
        if: steps.ftp-deploy-1.outcome == 'failure'
        run: sleep 15

      - name: 📤 Réessai Déploiement FTP vers OVH (Tentative 2)
        if: steps.ftp-deploy-1.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.cluster129.hosting.ovh.net
          username: hootinu
          password: ${{ secrets.OVH_FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ./www/
          dangerous-clean-slate: false
          timeout: 180000
          log-level: verbose
