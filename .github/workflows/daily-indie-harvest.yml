name: 🦉 Daily Indie Games Harvest

on:
  schedule:
    # S'exécute automatiquement chaque nuit à 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch: # Permet de lancer le moissonnage manuellement depuis l'onglet Actions de GitHub

permissions:
  contents: write

concurrency:
  group: 'ovh-deploy'
  cancel-in-progress: false

jobs:
  harvest-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Récupération du code source
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: ⚙️ Configuration de l'environnement Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Installation des dépendances
        run: npm ci

      - name: 🔍 Moissonnage des nouveautés indés Steam
        run: npx tsx scripts/dailyIndieHarvest.ts

      - name: 🏷️ Synchronisation des prix et évaluations Steam Store
        run: npm run sync-store

      - name: 🛡️ Audit de conformité & Règle Zéro Hallucination
        run: npm run audit-db

      - name: 🦉 Supabase Keep-Alive Ping (Anti-Mise en pause)
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            echo "📡 Envoi de la requête Keep-Alive vers Supabase pour réinitialiser le compteur d'inactivité..."
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -m 15 \
              -H "apikey: $SUPABASE_ANON_KEY" \
              -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
              "$SUPABASE_URL/rest/v1/chat_messages?select=id&limit=1" || true)
            echo "📊 Code de réponse Supabase : $HTTP_CODE"
            if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 400 ]; then
              echo "✅ Supabase pingé avec succès ! Compteur d'inactivité réinitialisé à zéro."
            else
              echo "⚠️ Avertissement : Le ping Supabase a retourné le code $HTTP_CODE (ou le service est momentanément indisponible)."
            fi
          else
            echo "ℹ️ Variables SUPABASE_URL ou SUPABASE_ANON_KEY absentes, étape ignorée."
          fi

      - name: 🔐 Configuration des variables d'environnement Vite (.env)
        run: |
          SUPA_URL="${{ secrets.VITE_SUPABASE_URL || secrets.SUPABASE_URL }}"
          SUPA_KEY="${{ secrets.VITE_SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}"
          if [ -n "$SUPA_URL" ] && [ -n "$SUPA_KEY" ]; then
            echo "VITE_SUPABASE_URL=$SUPA_URL" >> .env
            echo "VITE_SUPABASE_ANON_KEY=$SUPA_KEY" >> .env
            echo "✅ Variables VITE_SUPABASE_* écrites dans .env"
          else
            echo "⚠️ Attention : Secrets Supabase absents dans GitHub Secrets !"
          fi

      - name: 🏗️ Compilation de production du site (Vite / React)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
        run: npm run build

      - name: 🚀 Commit et Push des nouveaux jeux vers GitHub
        id: commit_step
        run: |
          git config --local user.email "bot@hootindiegames.com"
          git config --local user.name "Hoot Bot (Daily Harvest)"
          if [ -n "$(git status --porcelain src/data/ public/data/ scripts/steam_cache.json scripts/steam_store_cache.json scripts/harvest_rejected.json)" ]; then
            echo "📋 Modifications détectées dans les données. Préparation du commit..."
            git status --short
            # Inclure l'ensemble des données récoltées (Steam, Itch.io, Catalogue, Radar, caches) ainsi que index.html mis à jour par prebuild (SEO)
            git add src/data/ public/data/ scripts/steam_cache.json scripts/steam_store_cache.json scripts/harvest_rejected.json index.html
            git commit -m "chore(data): moissonnage nocturne Steam & Itch.io, synchronisation du radar [skip ci]"
            # Nettoyage défensif des fichiers résiduels pour garantir un répertoire de travail 100% propre
            git checkout -- . 2>/dev/null || true
            echo "🔄 Synchronisation avec origin/main..."
            git pull --rebase origin main
            echo "🚀 Push vers GitHub..."
            git push origin HEAD:main
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "🎉 Base de données et Radar mis à jour et poussés sur GitHub avec succès !"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "☕ Aucun changement à pousser aujourd'hui."
          fi

      - name: ✉️ Configuration sécurisée de messagerie (Resend)
        run: |
          echo "<?php define('RESEND_API_KEY', '${{ secrets.RESEND_API_KEY }}');" > public/api/.mail_config.php
          mkdir -p dist/api
          cp public/api/.mail_config.php dist/api/.mail_config.php

      - name: 📤 Déploiement automatique vers l'hébergement OVH
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ftp.cluster129.hosting.ovh.net
          username: hootinu
          password: ${{ secrets.OVH_FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ./www/
          dangerous-clean-slate: false
